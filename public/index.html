<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Shop</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f5f7;color:#222}
header{background:#111;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:#6c47ff;color:#fff;font-size:14px}
main{max-width:1000px;margin:20px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:#fff;border-radius:12px;padding:16px;text-align:center}
.card .img{font-size:56px}.price{font-weight:700;margin:6px 0}
#cart{position:fixed;top:0;right:-380px;width:360px;max-width:100%;height:100%;background:#fff;padding:20px;overflow:auto;transition:.25s;box-shadow:-4px 0 20px #0003}
#cart.open{right:0}
input,textarea{width:100%;padding:9px;margin:5px 0;border:1px solid #ccc;border-radius:6px}
.row{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
</style></head><body>
<header><h2 style="margin:0">🛍️ My Shop</h2><button onclick="toggle()">Cart (<span id="cnt">0</span>)</button></header>
<main><div class="grid" id="grid"></div></main>
<aside id="cart">
  <h3>Your Cart <button style="float:right;background:#999" onclick="toggle()">✕</button></h3>
  <div id="items"></div><hr>
  <div class="row"><b>Total</b><b id="total">৳0</b></div>
  <input id="name" placeholder="Name"><input id="phone" placeholder="Phone">
  <textarea id="address" placeholder="Address" rows="2"></textarea>
  <button style="width:100%" onclick="checkout()">Place Order (Cash on Delivery)</button>
  <p id="msg"></p>
</aside>
<script>
let products=[],cart=JSON.parse(localStorage.cart||'{}');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toggle=()=>document.getElementById('cart').classList.toggle('open');
async function load(){
  products=await (await fetch('/api/products')).json();
  document.getElementById('grid').innerHTML=products.map(p=>`<div class="card">
    <div class="img">${esc(p.image)}</div><h4>${esc(p.name)}</h4><small>${esc(p.description)}</small>
    <div class="price">৳${p.price}</div><button onclick="add(${p.id})">Add to cart</button></div>`).join('');
  render();
}
function add(id){cart[id]=(cart[id]||0)+1;save()}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save()}
function save(){localStorage.cart=JSON.stringify(cart);render()}
function render(){
  let t=0,n=0;
  const html=Object.keys(cart).map(id=>{const p=products.find(x=>x.id==id);if(!p)return'';
    t+=p.price*cart[id];n+=cart[id];
    return `<div class="row"><span>${esc(p.name)} ×${cart[id]}</span><span>৳${p.price*cart[id]}
    <button onclick="chg(${id},-1)">−</button><button onclick="chg(${id},1)">+</button></span></div>`}).join('');
  document.getElementById('items').innerHTML=html||'<p>Cart is empty</p>';
  document.getElementById('total').textContent='৳'+t;document.getElementById('cnt').textContent=n;
}
async function checkout(){
  const items=Object.keys(cart).map(id=>({id:+id,qty:cart[id]}));
  const body={name:name.value,phone:phone.value,address:address.value,items};
  const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(d.ok){cart={};save();msg.textContent=`✅ Order #${d.orderId} placed! Total ৳${d.total}`}
  else msg.textContent='❌ '+(d.error||'Failed');
}
load();
</script></body></html>
